name: Repo Vibecheck
description: Verify that an AI-generated repository works and matches what was requested.
author: iueowiqj213
branding:
  icon: check-circle
  color: purple
inputs:
  path:
    description: Repository path to scan, relative to the workflow workspace.
    required: false
    default: .
  requirements:
    description: Requirements file, resolved relative to the scanned repository.
    required: false
    default: ""
  prompt:
    description: Original prompt file, resolved relative to the scanned repository.
    required: false
    default: ""
  fail-on:
    description: Failure threshold (never, error, warning).
    required: false
    default: error
  offline:
    description: Skip registry metadata lookups.
    required: false
    default: "true"
  redact:
    description: Redact secret-like evidence and home paths.
    required: false
    default: "true"
  config:
    description: Policy configuration file.
    required: false
    default: ""
  baseline:
    description: Baseline file for new-only gating.
    required: false
    default: ""
  run-install:
    description: Execute the detected package-manager install command.
    required: false
    default: "false"
  run-scripts:
    description: Execute finite build and test scripts.
    required: false
    default: "false"
outputs:
  sarif:
    description: Path to the generated SARIF report.
    value: ${{ steps.scan.outputs.sarif }}
runs:
  using: composite
  steps:
    - name: Set up Node.js
      uses: actions/setup-node@48b55a011bda9f5d6aeb4c2d9c7362e8dae4041e # v6
      with:
        node-version: 24
        cache: npm
        cache-dependency-path: ${{ github.action_path }}/package-lock.json
    - name: Install Repo Vibecheck
      shell: bash
      working-directory: ${{ github.action_path }}
      run: npm ci --ignore-scripts && npm run build
    - name: Scan repository
      id: scan
      shell: bash
      env:
        ACTION_PATH: ${{ github.action_path }}
        TARGET_PATH: ${{ inputs.path }}
        REQUIREMENTS_PATH: ${{ inputs.requirements }}
        PROMPT_PATH: ${{ inputs.prompt }}
        FAIL_ON: ${{ inputs.fail-on }}
        RUN_INSTALL: ${{ inputs.run-install }}
        RUN_SCRIPTS: ${{ inputs.run-scripts }}
        OFFLINE: ${{ inputs.offline }}
        REDACT: ${{ inputs.redact }}
        CONFIG_PATH: ${{ inputs.config }}
        BASELINE_PATH: ${{ inputs.baseline }}
      run: |
        sarif_path="$RUNNER_TEMP/repo-vibecheck.sarif"
        args=(scan "$TARGET_PATH" --fail-on "$FAIL_ON" --format sarif --output "$sarif_path")
        if [[ -n "$REQUIREMENTS_PATH" ]]; then args+=(--requirements "$REQUIREMENTS_PATH"); fi
        if [[ -n "$PROMPT_PATH" ]]; then args+=(--prompt "$PROMPT_PATH"); fi
        if [[ "$RUN_INSTALL" == "true" ]]; then args+=(--run-install); fi
        if [[ "$RUN_SCRIPTS" == "true" ]]; then args+=(--run-scripts); fi
        if [[ "$OFFLINE" == "true" ]]; then args+=(--offline); fi
        if [[ "$REDACT" == "true" ]]; then args+=(--redact); fi
        if [[ -n "$CONFIG_PATH" ]]; then args+=(--config "$CONFIG_PATH"); fi
        if [[ -n "$BASELINE_PATH" ]]; then args+=(--baseline "$BASELINE_PATH"); fi
        node "$ACTION_PATH/dist/cli.js" "${args[@]}"
        echo "sarif=$sarif_path" >> "$GITHUB_OUTPUT"
